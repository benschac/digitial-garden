[lint]
ignorePatterns = [".agents/", ".codex/skills/"]

# Biome 2.5.15 recommended rules + React/Next domains.
# Complete mapping and remaining gaps: docs/biome-rule-coverage.json.
# Bun defaults remain enabled; explicit levels preserve the previous severities.
[lint.rules]
"@next/next/google-font-display" = "warn"
"@next/next/google-font-preconnect" = "error"
"@next/next/inline-script-id" = "error"
"@next/next/no-async-client-component" = "error"
"@next/next/no-document-import-in-page" = "warn"
"@next/next/no-head-element" = "warn"
"@next/next/no-head-import-in-document" = "warn"
"@next/next/no-html-link-for-pages" = "error"
"@next/next/no-img-element" = "warn"
"@next/next/no-unwanted-polyfillio" = "warn"
"typescript/adjacent-overload-signatures" = "warn"
"typescript/ban-ts-comment" = [
  "warn",
  { ts-ignore = true, ts-nocheck = false, ts-check = false, ts-expect-error = false },
]
"typescript/ban-types" = "warn"
"typescript/consistent-type-exports" = "warn"
"typescript/consistent-type-imports" = "warn"
"typescript/dot-notation" = "error"
"typescript/no-array-constructor" = "error"
"typescript/no-dupe-class-members" = "error"
"typescript/no-duplicate-enum-values" = "warn"
"typescript/no-empty-interface" = "error"
"typescript/no-explicit-any" = "error"
"typescript/no-extra-non-null-assertion" = "warn"
"typescript/no-invalid-void-type" = "warn"
"typescript/no-loss-of-precision" = ["error", { ignoreDecimals = false }]
"typescript/no-misused-new" = "error"
"typescript/no-non-null-asserted-optional-chain" = "error"
"typescript/no-non-null-assertion" = "error"
"typescript/no-redeclare" = "error"
"typescript/no-this-alias" = "error"
"typescript/no-unnecessary-type-constraint" = "error"
"typescript/no-unsafe-declaration-merging" = "error"
"typescript/no-unused-private-class-members" = "warn"
"typescript/no-unused-vars" = [
  "warn",
  { args = "all", argsIgnorePattern = "^_", varsIgnorePattern = "^_", caughtErrors = "all", caughtErrorsIgnorePattern = "^_", destructuredArrayIgnorePattern = "^_", ignoreRestSiblings = true },
]
"typescript/no-use-before-define" = [
  "error",
  { functions = false, classes = true, variables = true, enums = true, typedefs = false, ignoreTypeReferences = true, allowNamedExports = true },
]
"typescript/no-useless-constructor" = "error"
"typescript/no-useless-empty-export" = "error"
"typescript/prefer-function-type" = "error"
"typescript/prefer-literal-enum-member" = "warn"
"typescript/prefer-namespace-keyword" = "error"
"typescript/prefer-optional-chain" = "warn"
"array-callback-return" = "error"
"constructor-super" = "error"
"default-case-last" = "warn"
"eqeqeq" = ["error", "always", { null = "ignore" }]
"for-direction" = "error"
"getter-return" = "error"
"jsx-a11y/alt-text" = "error"
"jsx-a11y/anchor-ambiguous-text" = "error"
"jsx-a11y/anchor-has-content" = "error"
"jsx-a11y/anchor-is-valid" = "error"
"jsx-a11y/aria-activedescendant-has-tabindex" = "error"
"jsx-a11y/aria-props" = "error"
"jsx-a11y/aria-proptypes" = "error"
"jsx-a11y/aria-role" = "error"
"jsx-a11y/aria-unsupported-elements" = "error"
"jsx-a11y/autocomplete-valid" = "error"
"jsx-a11y/click-events-have-key-events" = "error"
"jsx-a11y/heading-has-content" = "error"
"jsx-a11y/html-has-lang" = "error"
"jsx-a11y/iframe-has-title" = "error"
"jsx-a11y/img-redundant-alt" = "error"
"jsx-a11y/interactive-supports-focus" = "error"
"jsx-a11y/label-has-associated-control" = "error"
"jsx-a11y/lang" = "error"
"jsx-a11y/media-has-caption" = "error"
"jsx-a11y/mouse-events-have-key-events" = "error"
"jsx-a11y/no-access-key" = "error"
"jsx-a11y/no-aria-hidden-on-focusable" = "error"
"jsx-a11y/no-autofocus" = "error"
"jsx-a11y/no-distracting-elements" = "error"
"jsx-a11y/no-interactive-element-to-noninteractive-role" = "error"
"jsx-a11y/no-noninteractive-element-to-interactive-role" = "error"
"jsx-a11y/no-noninteractive-tabindex" = "error"
"jsx-a11y/no-redundant-roles" = "error"
"jsx-a11y/no-static-element-interactions" = "error"
"jsx-a11y/prefer-tag-over-role" = "error"
"jsx-a11y/role-has-required-aria-props" = "error"
"jsx-a11y/role-supports-aria-props" = "error"
"jsx-a11y/scope" = "error"
"jsx-a11y/tabindex-no-positive" = "error"
"no-array-constructor" = "off"
"no-async-promise-executor" = "error"
"no-case-declarations" = "error"
"no-class-assign" = "error"
"no-compare-neg-zero" = "error"
"no-cond-assign" = ["error", "always"]
"no-const-assign" = "error"
"no-constructor-return" = "error"
"no-control-regex" = "error"
"no-debugger" = "error"
"no-dupe-args" = "error"
"no-dupe-class-members" = "off"
"no-dupe-else-if" = "error"
"no-dupe-keys" = "error"
"no-duplicate-case" = "error"
"no-empty-character-class" = "error"
"no-empty-pattern" = ["error", { allowObjectPatternsAsParameters = false }]
"no-eval" = "error"
"no-ex-assign" = "warn"
"no-extra-boolean-cast" = "error"
"no-extra-label" = "error"
"no-fallthrough" = "error"
"no-func-assign" = "error"
"no-global-assign" = "error"
"no-import-assign" = "error"
"no-inner-declarations" = "error"
"no-irregular-whitespace" = "warn"
"no-label-var" = "error"
"no-labels" = "warn"
"no-lone-blocks" = "error"
"no-misleading-character-class" = "error"
"no-nonoctal-decimal-escape" = "error"
"no-obj-calls" = "error"
"no-octal-escape" = "warn"
"no-proto" = "warn"
"no-prototype-builtins" = "warn"
"no-redeclare" = "off"
"no-regex-spaces" = "warn"
"no-restricted-globals" = [
  "warn",
  { globals = ["isFinite", "isNaN"], checkGlobalObject = true },
]
"no-script-url" = "error"
"no-self-assign" = "error"
"no-self-compare" = "error"
"no-sequences" = "warn"
"no-setter-return" = "error"
"no-shadow-restricted-names" = "error"
"no-sparse-arrays" = "error"
"no-template-curly-in-string" = "warn"
"no-this-before-super" = "error"
"no-undef-init" = "error"
"no-unneeded-ternary" = "error"
"no-unreachable" = "error"
"no-unsafe-finally" = "error"
"no-unsafe-negation" = "error"
"no-unsafe-optional-chaining" = "error"
"no-unused-labels" = "warn"
"no-unused-vars" = "off"
"no-use-before-define" = "off"
"no-useless-backreference" = "warn"
"no-useless-catch" = "error"
"no-useless-computed-key" = "error"
"no-useless-constructor" = "off"
"no-useless-escape" = "error"
"no-useless-rename" = "error"
"no-with" = "error"
"oxc/approx-constant" = "warn"
"oxc/bad-min-max-func" = "error"
"oxc/misrefactored-assign-op" = "error"
"oxc/no-accumulating-spread" = "warn"
"oxc/no-const-enum" = "warn"
"prefer-arrow-callback" = "warn"
"prefer-const" = "warn"
"prefer-exponentiation-operator" = "error"
"prefer-numeric-literals" = "warn"
"prefer-regex-literals" = "warn"
"prefer-rest-params" = "warn"
"prefer-template" = "error"
"radix" = "error"
"react-hooks/exhaustive-deps" = "error"
"react-hooks/rules-of-hooks" = "error"
"react/button-has-type" = "error"
"react/jsx-key" = ["error", { checkArraysOutsideJSX = true }]
"react/jsx-no-comment-textnodes" = "error"
"react/jsx-no-script-url" = "error"
"react/jsx-no-target-blank" = [
  "error",
  { allowReferrer = true, enforceDynamicLinks = "always", warnOnSpreadAttributes = true, links = true, forms = true },
]
"react/jsx-no-useless-fragment" = ["error", { allowExpressions = true }]
"react/no-array-index-key" = "error"
"react/no-children-prop" = "error"
"react/no-danger" = "error"
"react/no-danger-with-children" = "error"
"react/no-render-return-value" = "error"
"react/void-dom-elements-no-children" = "error"
"require-yield" = "error"
"unicorn/new-for-builtins" = "error"
"unicorn/no-document-cookie" = "warn"
"unicorn/no-instanceof-array" = "warn"
"unicorn/no-static-only-class" = "warn"
"unicorn/no-thenable" = "error"
"unicorn/no-useless-switch-case" = "error"
"unicorn/prefer-array-flat" = "error"
"unicorn/prefer-array-flat-map" = "error"
"unicorn/prefer-array-index-of" = "error"
"unicorn/prefer-date-now" = "warn"
"unicorn/prefer-node-protocol" = "error"
"use-isnan" = "error"
"valid-typeof" = "error"

[fmt]
printWidth = 80
tabWidth = 2
useTabs = false
semi = true
singleQuote = false
sortImports = true
# Preserve authored Tailwind order and cn() merge behavior.
sortTailwindcss = false
ignorePatterns = [".agents/", ".codex/skills/", "bun.lock"]
