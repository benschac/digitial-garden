name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches-ignore:
      - "**/graphite-base/**"
      - "graphite-base/**"
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  optimize_ci:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      GRAPHITE_CI_OPTIMIZER_TOKEN: ${{ secrets.GRAPHITE_CI_OPTIMIZER_TOKEN }}
    outputs:
      skip: ${{ steps.graphite.outputs.skip }}
    steps:
      - name: Optimize CI with Graphite
        id: graphite
        if: ${{ env.GRAPHITE_CI_OPTIMIZER_TOKEN != '' }}
        uses: withgraphite/graphite-ci-action@402a89bc8aa6db18ae1f9c61953d001d5f9d828f
        with:
          graphite_token: ${{ env.GRAPHITE_CI_OPTIMIZER_TOKEN }}
          github_token: ${{ github.token }}
  verify:
    needs: optimize_ci
    if: ${{ always() && !cancelled() && needs.optimize_ci.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-node24-bun1.4.3-turbo-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-bun1.4.3-turbo-${{ hashFiles('bun.lock') }}-
      - run: bun run verify:full
